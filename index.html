<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Mentor | Results Summary Component</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <article class="card">
        <!-- ===================== LEFT — Result ===================== -->
        <section class="result" aria-label="Your result">
          <h1 class="result__title">Your Result</h1>

          <div class="result__circle" aria-label="Score: 76 out of 100">
            <p class="result__score">76</p>
            <p class="result__total">of 100</p>
          </div>

          <h2 class="result__rank">Great</h2>

          <p class="result__description">
            You scored higher than 65% of the people who have taken these tests.
          </p>
        </section>

        <!-- ===================== RIGHT — Summary ===================== -->
        <section class="summary" aria-label="Score summary">
          <h2 class="summary__title">Summary</h2>

          <ul class="summary__list">
            <!-- Reaction -->
            <li class="summary__item summary__item--reaction">
              <span class="summary__item-label">
                <!-- Lightning bolt icon -->
                <svg
                  class="summary__item-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 20 20"
                  fill="none"
                  aria-hidden="true"
                >
                  <path
                    d="M10.833 1.667 3.333 11.25h6.25l-.833 7.083 8.333-10.416h-6.25l.833-7.25Z"
                    stroke="currentColor"
                    stroke-width="1.75"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                Reaction
              </span>
              <p class="summary__item-score">80 <span>/ 100</span></p>
            </li>

            <!-- Memory -->
            <li class="summary__item summary__item--memory">
              <span class="summary__item-label">
                <!-- Brain / clock icon -->
                <svg
                  class="summary__item-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 20 20"
                  fill="none"
                  aria-hidden="true"
                >
                  <circle
                    cx="10"
                    cy="10"
                    r="7.5"
                    stroke="currentColor"
                    stroke-width="1.75"
                  />
                  <path
                    d="M10 6.25v4.167l2.5 2.5"
                    stroke="currentColor"
                    stroke-width="1.75"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                Memory
              </span>
              <p class="summary__item-score">92 <span>/ 100</span></p>
            </li>

            <!-- Verbal -->
            <li class="summary__item summary__item--verbal">
              <span class="summary__item-label">
                <!-- Chat / speech bubble icon -->
                <svg
                  class="summary__item-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 20 20"
                  fill="none"
                  aria-hidden="true"
                >
                  <path
                    d="M17.5 9.583c0 3.683-3.358 6.667-7.5 6.667-.832 0-1.63-.117-2.38-.333L2.5 17.5l1.25-3.333A6.22 6.22 0 0 1 2.5 9.583C2.5 5.9 5.858 2.917 10 2.917s7.5 2.983 7.5 6.666Z"
                    stroke="currentColor"
                    stroke-width="1.75"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                Verbal
              </span>
              <p class="summary__item-score">61 <span>/ 100</span></p>
            </li>

            <!-- Visual -->
            <li class="summary__item summary__item--visual">
              <span class="summary__item-label">
                <!-- Eye icon -->
                <svg
                  class="summary__item-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 20 20"
                  fill="none"
                  aria-hidden="true"
                >
                  <path
                    d="M2.083 10S4.583 4.167 10 4.167 17.917 10 17.917 10 15.417 15.833 10 15.833 2.083 10 2.083 10Z"
                    stroke="currentColor"
                    stroke-width="1.75"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <circle
                    cx="10"
                    cy="10"
                    r="2.083"
                    stroke="currentColor"
                    stroke-width="1.75"
                  />
                </svg>
                Visual
              </span>
              <p class="summary__item-score">73 <span>/ 100</span></p>
            </li>
          </ul>

          <button class="btn-continue" type="button">Continue</button>
        </section>
      </article>
    </main>

    <!-- Attribution -->
    <footer>
      <p class="attribution">
        Challenge by
        <a
          href="https://www.frontendmentor.io?ref=challenge"
          target="_blank"
          rel="noopener"
        >
          Frontend Mentor </a
        >. Coded by <a href="#">Your Name Here</a>.
      </p>
    </footer>
  </body>
</html>
